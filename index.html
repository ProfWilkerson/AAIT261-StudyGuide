<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta charset="UTF-8">
  <title>AAIT261 Study Guide</title>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #006341;
    }

    /* Sidebar nav header */
    .sidebar .app-name a {
      color: #ffffff;
    }

    .sidebar {
      background-color: #003057;
    }

    .sidebar ul li a {
      color: #d4e8dc;
    }

    .sidebar ul li a:hover,
    .sidebar ul li.active > a {
      color: #ffffff;
      font-weight: 600;
    }

    /* Top nav bar */
    nav.app-nav {
      background-color: #003057;
    }

    nav.app-nav a {
      color: #d4e8dc;
    }

    /* Table header accent */
    table thead tr {
      background-color: #003057;
      color: #ffffff;
    }

    /* Inline code */
    p code {
      color: #003057;
      background: #e8f2ed;
    }
  </style>
</head>
<body>
  <div id="app">Loading...</div>
  <script>
    window.$docsify = {
      name: 'AAIT261 Study Guide',
      repo: 'https://github.com/ProfWilkerson/AAIT261-StudyGuide',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        placeholder: 'Search study guide...',
        noData: 'No results found.',
        depth: 3
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
